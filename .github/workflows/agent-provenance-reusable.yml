name: Apply AI provenance labels

on:
  workflow_call:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Consumer repos always execute code from the template main branch.
      # The template can test its own same-repo PR before this file reaches main.
      - uses: actions/checkout@v4
        with:
          repository: piotromashov/agentic-template
          ref: ${{ github.repository == 'piotromashov/agentic-template' && github.ref || 'main' }}
          persist-credentials: false
      - name: Label from PR or review body
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agent_provenance.py
